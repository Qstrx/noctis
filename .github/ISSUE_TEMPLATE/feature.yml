name: Improvement
description: Suggest an improvement to the collections or site.
title: "Improvement: "
body:
  - type: textarea
    id: need
    attributes:
      label: What would this help you do?
      description: Describe the current difficulty and the affected page or collection.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested change
      description: Describe the behavior you would like to see.
    validations:
      required: true
