name: Something isn’t working
description: Let’s get it working again.
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: Tell us what you were trying to do. A screenshot is welcome.
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Which page or scene?
      placeholder: Paste a link here, if you have one.
  - type: input
    id: device
    attributes:
      label: Phone or computer?
      description: Your browser or app name can help too.
