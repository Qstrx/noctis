<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src https://oceans-scenepacks.goatcounter.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0b0c">
<title>Back soon — Ocean’s Scenepacks</title>
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="alternate icon" href="img/icon-32.png" sizes="32x32">
<link rel="preload" href="img/fonts/anton-latin.woff2" as="font" type="font/woff2" crossorigin>
<script src="count.js?v=1" defer></script>
<style>
@font-face { font-family: "Anton"; src: url("img/fonts/anton-latin.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Barlow Condensed"; font-weight: 700; src: url("img/fonts/barlow-condensed-700-latin.woff2") format("woff2"); font-display: swap; }
:root { --page: #0b0b0c; --ink: #eef4f5; --muted: #8ea7ad; --accent: #6ff5bf; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 32px 16px;
  background: var(--page); color: var(--ink);
  font: 400 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
}
main { text-align: center; animation: in 1s cubic-bezier(.2, .7, .1, 1) both; }
@keyframes in { from { opacity: 0; transform: translateY(12px); } }
.status {
  display: inline-flex; align-items: center; gap: 10px; margin-bottom: 28px;
  font: 700 12px/1 "Barlow Condensed", "Arial Narrow", sans-serif;
  letter-spacing: .3em; text-transform: uppercase; color: var(--muted);
}
.status i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .2; } }
h1 { margin: 0 0 16px; font: 400 clamp(3rem, 14vw, 6rem)/.9 "Anton", Impact, sans-serif; text-transform: uppercase; }
p { margin: 0; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { main, .status i { animation: none; } }
</style>
</head>
<body>
<main>
  <div class="status"><i aria-hidden="true"></i>Maintenance</div>
  <h1>Back soon</h1>
  <p>The site is closed for a while. Nothing is gone.</p>
</main>
</body>
</html>
